<!DOCTYPE html>
<html>
<head>
    <title>Cloud Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-dark text-light">
    <h2 class="text-info">☁️ Central Cloud Admin (All Shops)</h2>
    <table class="table table-dark mt-4">
        <thead><tr><th>Shop ID</th><th>File Name</th><th>Action</th></tr></thead>
        <tbody>
            {% for job in jobs %}
            <tr>
                <td>{{ job[1] }}</td>
                <td>{{ job[2] }}</td>
                <td>
                    <a href="/download/{{ job[2] }}" target="_blank" class="btn btn-sm btn-info">Preview</a>
                    <form action="/approve/{{ job[0] }}" method="POST" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-success">Approve & Print</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
